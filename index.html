<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7ec">
  <title>Lily Pad</title>
  <!-- Home-screen app: name, icon, and colors (see manifest.webmanifest). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Lily Pad">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Splash: shown while the app starts, then faded out by app.js. -->
  <div id="splash" class="splash" aria-hidden="true">
    <img class="splash-frog" src="assets/frog.svg" alt="">
    <p class="splash-name">Lily Pad</p>
  </div>
  <script>
    // The splash shows once each time the app is opened, not on every page
    // load (switching to yesterday's puzzles loads the page again).
    try {
      if (sessionStorage.getItem('lily-pad-opened')) document.getElementById('splash').remove();
      else sessionStorage.setItem('lily-pad-opened', '1');
    } catch (error) { /* no storage (private browsing): the splash just shows each time */ }
  </script>

  <div class="app">

    <!-- Home: pick a puzzle -->
    <section id="home" class="view">
      <header class="top home-top">
        <h1 class="brand"><img class="brand-frog" src="assets/frog.svg" alt="">Lily Pad</h1>
        <!-- The pond: one lily pad per puzzle day. Drawn by app.js. -->
        <div class="pond" id="pond" role="img"></div>
        <p class="pond-caption" id="pond-caption"></p>
        <!-- Links to yesterday's puzzles after a missed day. Filled in by app.js. -->
        <a class="catch-up" id="catch-up" hidden></a>
        <!-- Opens the sticker book. The count is filled in by app.js. -->
        <a class="sticker-link" id="sticker-link" href="#stickers"></a>
        <!-- A look back at the last 7 days. Filled in by app.js. -->
        <p class="week-note" id="week-note" hidden></p>
      </header>

      <!-- Today's set: 5 puzzles picked for today. Filled in by app.js. -->
      <section class="today" aria-labelledby="today-title">
        <h2 class="today-title" id="today-title">Today's 5</h2>
        <p class="today-count" id="today-count"></p>
        <nav class="today-list" id="today-list" aria-label="Today's puzzles"></nav>
      </section>

      <!-- Every puzzle, for free choice. Closed until tapped. -->
      <details class="all-puzzles">
      <summary>All puzzles</summary>

      <!-- One section per group, with its cards, built by src/app.js from GROUPS and GAMES. -->
      <div id="groups"></div>

      </details>

      <p class="grown-up-link"><a href="#grown-ups">For grown-ups</a></p>
    </section>

    <!-- Each game's screen is added here by src/app.js, from its GAMES list. -->

  </div>

  <!-- Celebration card, shared by every game. -->
  <section id="done" class="done" role="dialog" aria-labelledby="done-title" hidden>
    <div class="done-card">
      <img class="done-star" src="assets/frog.svg" alt="">
      <p class="done-title" id="done-title">You did it!</p>
      <p class="done-streak" id="done-streak"></p>
      <!-- The gift: tap to open it and get a sticker. Filled in by app.js. -->
      <button class="gift" type="button" id="gift" hidden>
        <span class="gift-box" aria-hidden="true">🎁</span>
        <span class="gift-label">Tap to open your gift!</span>
      </button>
      <p class="gift-sticker" id="gift-sticker" hidden></p>
      <a class="button" href="#" id="done-next">Pick another puzzle</a>
      <button class="link-button" type="button" id="done-close">See my puzzle</button>
    </div>
  </section>

  <!-- Falling stars at the end of a puzzle. Filled in by app.js. -->
  <div id="confetti" class="confetti" aria-hidden="true"></div>

  <noscript>This puzzle needs JavaScript turned on.</noscript>
  <p id="load-problem" class="load-problem" role="alert" hidden>
    Lily Pad didn't finish loading. Pull down to refresh, or close it and open it again.
  </p>
  <script type="module" src="src/app.js"></script>
  <script>
    // If the app's code hasn't started after 5 seconds (for example, the
    // phone kept an old copy of a file after an update), say so kindly.
    setTimeout(function () {
      if (!window.lilyPadStarted) document.getElementById('load-problem').hidden = false;
    }, 5000);
  </script>
</body>
</html>
