<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7ec">
  <title>Puzzle Time</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <h1>Mystery Word</h1>
      <p class="legend">
        <span class="legend-item"><span class="swatch mark-here" aria-hidden="true"></span>right spot</span>
        <span class="legend-item"><span class="swatch mark-elsewhere" aria-hidden="true"></span>other spot</span>
        <span class="legend-item"><span class="swatch mark-none" aria-hidden="true"></span>not in word</span>
      </p>
    </header>

    <main id="game" class="game">
      <p class="loading">Getting today's puzzle…</p>
    </main>

    <section id="done" class="done" hidden>
      <div class="done-star" aria-hidden="true">★</div>
      <p class="done-title">All done for today!</p>
      <p class="done-note">Come back tomorrow for a new mystery word.</p>
    </section>
  </div>

  <noscript>This puzzle needs JavaScript turned on.</noscript>
  <script type="module" src="src/app.js"></script>
</body>
</html>
